name: Microservices CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  build-solution:
    name: Build .NET Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EcommerceMicroService.slnx

      - name: Build
        run: dotnet build EcommerceMicroService.slnx --configuration Release --no-restore

  build-images:
    name: Build Container Images (Podman)
    runs-on: ubuntu-latest
    needs: build-solution
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: authservice
            path: AuthService
          - name: productservice
            path: ProductService
          - name: inventoryservice
            path: InventoryService
          - name: orderservice
            path: OrderService
          - name: paymentservice
            path: PaymentService
          - name: apigateway
            path: WebApplication1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.service.name }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_SHA}"
          podman build \
            -f "${{ matrix.service.path }}/Containerfile" \
            -t "$IMAGE_TAG" \
            "${{ matrix.service.path }}"

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.service.name }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_SHA}"
          podman push "$IMAGE_TAG"
